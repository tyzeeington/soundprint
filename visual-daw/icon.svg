<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <!-- waveform -->
    <g stroke="#fff" stroke-linecap="round" fill="none" stroke-width="14" opacity="0.85">
      <path d="M70 256 Q 110 156 150 256 T 230 256 T 310 256 T 390 256 T 442 256"/>
      <path d="M70 320 Q 110 380 150 320 T 230 320 T 310 320 T 390 320 T 442 320" opacity="0.45"/>
      <path d="M70 192 Q 110 132 150 192 T 230 192 T 310 192 T 390 192 T 442 192" opacity="0.45"/>
    </g>
    <!-- music note -->
    <g transform="translate(316 130)" fill="#fff">
      <rect x="0" y="0" width="14" height="180" rx="4"/>
      <ellipse cx="-22" cy="178" rx="38" ry="28" transform="rotate(-18 -22 178)"/>
      <path d="M14 0 Q 78 30 78 90 L 78 110 Q 60 76 14 64 Z"/>
    </g>
  </g>
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#ring)" stroke-width="2"/>
</svg>
